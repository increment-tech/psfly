# Reusable quality gate for an Elixir repo on the psfly stack.
#
# Call from a consuming repo with a job-level `uses:`; the CALLER owns the triggers
# (pull_request, push, dispatch), concurrency, and paths filters — GitHub only fires
# workflows defined in the repo itself. See templates/ for the canonical callers.
#
# The gate SURFACE lives in the consuming repo's gate command (default `bin/precommit`),
# so CI and the local pre-commit hook can never drift apart — this workflow provides the
# runner, the pinned toolchain, the Postgres service, and the caching.
#
# Toolchain: installed by mise from the consuming repo's mise.toml — the ONE pin source.
# No Elixir/OTP version literal lives in CI.
name: gate

on:
  workflow_call:
    inputs:
      postgres-db:
        description: Test database name (what config/test.exs expects)
        required: true
        type: string
      postgres-port:
        description: Host port to publish Postgres on (what config/test.exs connects to)
        required: false
        type: number
        default: 5432
      postgres-image:
        description: Postgres image for the test database service
        required: false
        type: string
        default: postgres:18.4
      gate-command:
        description: The command that runs the whole gate surface
        required: false
        type: string
        default: bin/precommit
      parallel-dialyzer:
        description: >-
          Run dialyzer as a separate parallel job, making gate wall-clock the max of
          (tests, dialyzer) instead of their sum. Enable ONLY when the gate command
          itself does NOT run dialyzer — otherwise it runs twice.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Per-job ceiling so a hung tool can't run indefinitely
        required: false
        type: number
        default: 15
      runs-on:
        description: >-
          Runner label for the gate jobs. Default is GitHub-hosted; pass a self-hosted label, or an
          expression on a repo variable (vars.GATE_RUNNER || 'ubuntu-latest') to flip per repo
          without a commit. No expression syntax here: the parser evaluates it and `vars` is not
          available in this block, which breaks the whole file.
        required: false
        type: string
        default: ubuntu-latest
      cache-key-suffix:
        description: >-
          Separates this job's deps/_build/PLT cache from the caller's other gate jobs. Set it
          when one workflow calls this gate several times with different gate commands (e.g. a
          static lane that builds the dialyzer PLT beside test lanes that never do): caches are
          immutable per key and the FIRST job to finish saves, so lanes sharing a key can never
          persist the slow lane's PLT. Empty (the default) keeps the original shared key.
        required: false
        type: string
        default: ''
    secrets:
      PRIVATE_PACKAGES_TOKEN:
        description: >-
          Read-only token for private git deps in mix.exs (e.g. increment-tech/phx-harness).
          When set, git is pointed at it for https://github.com/ before `mix deps.get`. Callers
          pass it explicitly or use `secrets: inherit`.
        required: false

# Least privilege: the gate only reads the repo (no writes, no packages). A called
# workflow can never elevate beyond the caller; this pins the floor regardless of
# repo/org token defaults.
permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.postgres-db }}
        ports:
          - ${{ inputs.postgres-port }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Elixir/OTP from the repo's mise.toml — the single pin source CI reads.
      - name: Set up the pinned toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Restore deps, _build, and the dialyzer PLTs BEFORE fetch/compile so the cache
      # actually helps. The toolchain hash comes FIRST in the key and bounds the
      # restore-keys prefix, so a lockfile change restores the nearest same-toolchain
      # cache but an Elixir/OTP bump never restores another toolchain's _build/PLTs.
      # ~/.mix holds dialyxir's CORE PLT (OTP + stdlib), outside _build — without it
      # every run rebuilds the expensive core PLT. priv/plts covers repos that set a
      # plt_local_path. With `cache-key-suffix` set, the suffix goes after `mix-`, and a miss
      # falls back to the caller's unsuffixed cache (same toolchain) so a lane's first run
      # starts warm; with it empty both restore lines are the original prefix.
      # Keyed by runner.environment too: a dialyzer PLT records absolute OTP paths and checksums,
      # so one built on a GitHub-hosted runner is "Old PLT file" on a self-hosted one (and _build
      # carries the same toolchain fingerprint). Hosted and self-hosted keep separate caches.
      - name: Cache deps, _build, and PLTs
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
            priv/plts
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ inputs.cache-key-suffix != '' && format('{0}-', inputs.cache-key-suffix) || '' }}${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-mix-${{ inputs.cache-key-suffix != '' && format('{0}-', inputs.cache-key-suffix) || '' }}${{ hashFiles('mise.toml') }}-
            ${{ runner.os }}-${{ runner.environment }}-mix-${{ hashFiles('mise.toml') }}-

      - name: Authenticate git for private deps (when PRIVATE_PACKAGES_TOKEN is set)
        env:
          PRIVATE_PACKAGES_TOKEN: ${{ secrets.PRIVATE_PACKAGES_TOKEN }}
        run: |
          [ -n "$PRIVATE_PACKAGES_TOKEN" ] || { echo "no PRIVATE_PACKAGES_TOKEN; assuming no private deps"; exit 0; }
          git config --global \
            url."https://x-access-token:${PRIVATE_PACKAGES_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Fetch deps
        run: mix deps.get

      # A gate command that probes optional tools with `mix help <task>` only discovers a
      # dep's mix tasks once the dep is COMPILED — on a cold runner a bare deps.get turns
      # the probe into a false red. Compile deps before the gate probes them.
      - name: Compile deps
        run: mix deps.compile

      # CI=true explicitly, so a skip-becomes-fail backstop in the gate command doesn't
      # depend on the runner's env defaults.
      - name: Run the gate
        env:
          CI: "true"
        run: ${{ inputs.gate-command }}

  # Optional parallel dialyzer lane — the slowest single check runs beside the suite.
  # Runs in MIX_ENV=dev (dialyxir's default env), needs no Postgres.
  dialyzer:
    name: Dialyzer
    if: ${{ inputs.parallel-dialyzer }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up the pinned toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # A dev-keyed cache: dialyzer builds in :dev while the gate job builds in :test, and
      # GitHub caches are immutable per key — sharing one key would freeze whichever env
      # saved first. Toolchain hash first (bounding the restore prefix), lockfile second:
      # each dep change persists a fresh PLT, restore falls back only to a SAME-toolchain
      # PLT, which dialyzer updates incrementally. Covers both PLT homes (~/.mix core;
      # priv/plts local).
      - name: Cache deps, dev _build, and PLTs
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
            priv/plts
          key: ${{ runner.os }}-${{ runner.environment }}-mix-dev-${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-mix-dev-${{ hashFiles('mise.toml') }}-

      - name: Authenticate git for private deps (when PRIVATE_PACKAGES_TOKEN is set)
        env:
          PRIVATE_PACKAGES_TOKEN: ${{ secrets.PRIVATE_PACKAGES_TOKEN }}
        run: |
          [ -n "$PRIVATE_PACKAGES_TOKEN" ] || { echo "no PRIVATE_PACKAGES_TOKEN; assuming no private deps"; exit 0; }
          git config --global \
            url."https://x-access-token:${PRIVATE_PACKAGES_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Fetch deps
        run: mix deps.get

      # Builds the PLT if missing, then analyzes — one step.
      - name: Run dialyzer
        run: mix dialyzer --format github
